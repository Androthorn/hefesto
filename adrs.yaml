llm:
  provider: openrouter
  model: anthropic/claude-sonnet-4-20250514
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.7
  max_tokens: 4096

storage:
  type: sqlite
  path: ./adrs_history.db

analyzer:
  priority_metrics:
    - pending_pods
    - number_of_migrations
  variance_threshold: 0.1

output_dir: ./refined_prompts
include_reasoning: true
include_diff: true
